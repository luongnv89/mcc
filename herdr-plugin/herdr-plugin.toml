id = "mcc-usage"
name = "mcc usage"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "5-hour and weekly Claude Code usage of every mcc account, in a collapsible pane at the bottom-left of the tab."
platforms = ["linux", "macos"]

[[actions]]
id = "toggle"
title = "Toggle mcc usage panel"
contexts = ["workspace"]
command = ["node", "toggle.js"]

[[panes]]
id = "panel"
title = "mcc usage"
placement = "split"
command = ["node", "panel.js"]

[[actions]]
id = "bind-key"
title = "Bind a key to the mcc usage panel"
contexts = ["workspace"]
command = ["node", "bind-key.js"]
