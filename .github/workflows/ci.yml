name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked

  lint:
    name: clippy, fmt and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: shellcheck install.sh
        run: shellcheck install.sh

  brew-audit:
    name: brew audit
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      # `brew audit` only takes formulae by name, so serve the formula
      # from a throwaway local tap. No --online: a release commit points
      # `url` at a tag that is pushed after it (see the formula header).
      - name: brew audit packaging/homebrew/mcc.rb
        run: |
          brew tap-new --no-git local/mcc
          tap="$(brew --repository local/mcc)"
          cp packaging/homebrew/mcc.rb "$tap/Formula/mcc.rb"
          brew audit --strict local/mcc/mcc
